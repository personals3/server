# =============================================================================
# PersonalS3 — Nginx reverse proxy
#
#   /                  → Next.js dashboard (dashboard:3001)
#   /api/*             → Go API (api:3000) — /api prefix stripped
#   /stream/{id}/...   → static HLS/image from /storage/segments/{id}/...
#   /nginx-health      → "ok"
#
# This single-origin layout means the tunnel only needs ONE hostname and
# the browser doesn't have to worry about CORS — same origin for everything.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 1024 matches the container's default RLIMIT_NOFILE on Debian/Alpine
    # docker hosts, so we don't get the "worker_connections exceed open
    # file resource limit" warning on every reload. For a personal server
    # this is plenty — 1024 concurrent connections per worker is well
    # beyond realistic load. Raise to 4096+ only if you also raise the
    # container ulimit (compose: `ulimits: nofile: { soft: 8192, hard: 8192 }`).
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Only add types the default mime.types doesn't already include.
    # m3u8, ts, webp, avif are present in nginx:alpine's mime.types so we
    # used to get "duplicate extension" warnings on every reload; mpd is
    # the only one actually missing.
    types {
        application/dash+xml           mpd;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Large uploads — proxied PUTs may carry many GB
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering on;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    map $http_x_forwarded_for $forwarded_for {
        ""      $remote_addr;
        default "$http_x_forwarded_for, $remote_addr";
    }

    # Per-extension cache policy for /stream/ content.
    #
    # Pipelines can be re-run (the "Re-pipeline" button overwrites segments
    # in-place at the same path), so we CAN'T mark segments immutable.
    # Browsers serve stale Range responses from disk cache when bytes change
    # under a long-cached URL, breaking playback with mysterious `(canceled)`
    # requests. Keep TTLs short so any re-pipeline propagates within minutes.
    #   m3u8     — must-revalidate every load; the master is the source of truth
    #   ts/aac   — short TTL; re-pipelined content shows up fast
    #   images   — longer (thumbnails do change but rarely; still bounded)
    map $uri $stream_cache {
        default                              "public, max-age=300";
        "~*\.(m3u8)$"                        "public, max-age=10, must-revalidate";
        "~*\.(ts|aac|mp3|ogg)$"              "public, max-age=300";
        "~*\.(webp|avif|jpg|jpeg|png)$"      "public, max-age=86400";
    }

    upstream api_backend       { server api:3000;       keepalive 32; }
    upstream dashboard_backend { server dashboard:3001; keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;

        # -------------------------------------------------------------------
        # /stream/* — static HLS / image / segment serving (sendfile)
        # -------------------------------------------------------------------
        location /stream/ {
            alias /storage/segments/;

            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            add_header Accept-Ranges "bytes" always;
            add_header Cache-Control $stream_cache always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range, Content-Type";
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # /api/* — Go API. The trailing slash on proxy_pass strips the
        # "/api" prefix so the API still sees /auth/login, /:bucket/*, etc.
        # -------------------------------------------------------------------

        # AWS S3 clients sometimes hit "/api" without a trailing slash for
        # ListBuckets. Internally rewrite (no 301 — would break SigV4) so the
        # request flows through the /api/ block.
        location = /api {
            rewrite ^ /api/ last;
        }

        location /api/ {
            # CORS — same-origin so usually unnecessary, but allows browsers
            # at other origins (or older Safari) to call the API.
            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Range, If-Match, If-None-Match" always;
            add_header Access-Control-Expose-Headers    "ETag, X-Object-Size, X-RateLimit-Limit, X-RateLimit-Remaining, Content-Length, Content-Range" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      "$http_origin";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Range, If-Match, If-None-Match";
                add_header Access-Control-Max-Age           86400;
                return 204;
            }

            proxy_pass         http://api_backend/;   # trailing / strips /api prefix
            # $http_host preserves the port — SigV4 includes "host:hostname:port"
            # in its signature, so passing $host (without port) would break it.
            proxy_set_header   Host                $http_host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            # Pass the FULL original request URI so the SigV4 verifier can
            # recreate exactly what the client signed (path+query as-sent,
            # before any rewrites).
            proxy_set_header   X-Original-URI      $request_uri;
            proxy_set_header   Connection          "";
        }

        # -------------------------------------------------------------------
        # /share/* — public download for legacy presigned URLs (no auth)
        # -------------------------------------------------------------------
        location /share/ {
            # Long timeouts because shared files can be large videos
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Permissive CORS so the link can be embedded in any external page
            add_header Access-Control-Allow-Origin "*" always;
        }

        # -------------------------------------------------------------------
        # /s/<token> — opaque short share URL (the dashboard's new default).
        # Same behavior as /share/ — no auth, presign-token in the path.
        # Without this block the request would fall through to the dashboard
        # backend and return a 404 from Next.js.
        # -------------------------------------------------------------------
        location /s/ {
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            add_header Access-Control-Allow-Origin "*" always;
        }

        # -------------------------------------------------------------------
        # /public/* — public-bucket anonymous read (no auth, no signing)
        #   GET /public/{bucket}/         → index.html or JSON listing
        #   GET /public/{bucket}/{key}    → raw object bytes (Range supported)
        # The bucket's is_public flag is the gate; private buckets return 404.
        # -------------------------------------------------------------------
        location /public/ {
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Permissive CORS — public buckets are meant to be hot-linked
            # from arbitrary origins (static sites, image embeds).
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Nginx-only health
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # -------------------------------------------------------------------
        # / — Next.js dashboard (catch-all)
        # -------------------------------------------------------------------
        location / {
            proxy_pass         http://dashboard_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Next.js may use WebSocket for HMR in dev; harmless in prod build
            proxy_set_header   Upgrade           $http_upgrade;
        }
    }
}
