[project]
name = "personals3-worker"
version = "0.1.0"
description = "Transcoding worker for PersonalS3 (FFmpeg + Pillow)"
requires-python = ">=3.11"

dependencies = [
    "psycopg[binary]>=3.2",   # PostgreSQL driver
    "Pillow>=10.4",            # image processing
    "redis>=5.0",              # Valkey client (pub/sub for cancel-on-delete)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]
